{% extends "accounts/base.html" %}
{% load static %}

{% block title %}Set New Password - EcoRate{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px;">
  <div class="card-header">
    <div style="font-size: 2rem; margin-bottom: 1rem;">🔐</div>
    <h2>Set New Password</h2>
    <p style="margin: 0.5rem 0 0 0; color: rgba(255, 255, 255, 0.9);">Enter your new password</p>
  </div>

  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      
      <div class="mb-6">
        <label class="form-label" for="password1">New Password</label>
        <input type="password" id="password1" name="password1" class="form-control" required placeholder="Enter new password" minlength="8">
      </div>
      
      <div class="mb-6">
        <label class="form-label" for="password2">Confirm New Password</label>
        <input type="password" id="password2" name="password2" class="form-control" required placeholder="Confirm new password" minlength="8">
      </div>
      
      <div class="text-center">
        <button type="submit" class="btn-primary" style="width: 100%;">Reset Password</button>
      </div>
    </form>

    <div class="text-center mt-6" style="padding-top: 1.5rem; border-top: 1px solid var(--neutral-200);">
      <p style="color: var(--neutral-600);">Remember your password? 
        <a href="{% url 'login' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
