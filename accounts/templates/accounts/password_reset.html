{% extends "accounts/base.html" %}
{% load static %}

{% block title %}Reset Password - EcoRate{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px;">
  <div class="card-header">
    <div style="font-size: 2rem; margin-bottom: 1rem;">🔐</div>
    <h2>Reset Password</h2>
    <p style="margin: 0.5rem 0 0 0; color: rgba(255, 255, 255, 0.9);">Enter your email to reset your password</p>
  </div>

  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      
      <div class="mb-6">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your registered email">
      </div>
      
      <div class="text-center">
        <button type="submit" class="btn-primary" style="width: 100%;">Send Reset Link</button>
      </div>
    </form>

    <div class="text-center mt-6" style="padding-top: 1.5rem; border-top: 1px solid var(--neutral-200);">
      <p style="color: var(--neutral-600);">Remember your password? 
        <a href="{% url 'login' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
